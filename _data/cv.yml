    Experience:
      - company: Epsilla (YC S23)
        position: AI Engineer
        location: Remote
        url: https://www.epsilla.com
        start_date: 2026-02
        summary: ""
        highlights:
          - "Shipped Stanford SIS end-to-end as a Next.js research assistant over a biomedical knowledge graph of 3.3M+ PubMed articles in Google Spanner, with Neon Postgres for product state and agents running on the Claude Code harness. Exposed the graph to agents through MCP servers with 7 retrieval tools, and built an app-side review loop that verifies every citation against the graph."
          - "Built gene monograph generation from ranked, evidence-graded claims, cached and shared across users."
          - "Co-authored and released ClawTrace, an open-source cost-aware tracing platform for LLM agents. Captures per-step cost and token attribution across LLM calls, tool calls, and sub-agents, compressed into compact TraceCards for skill distillation. Built an AI analyst that diagnoses expensive or failing runs and distills traces into reusable agent skills; cost-attributed prune rules cut regressions from 14 to 5 versus an ablation without them."
          - "Implemented HarnessRouter, an open-source router for 30 coding-agent harnesses. Moved the DeepSeek Harness onto the runner's shared relay so provider API keys never reach the agent, and fixed self-hosted model failures by stripping oversized max_tokens and surfacing providers' real refusal reasons, verified on a live vLLM server."
          - "Built the shared identity and authorization core every Epsilla product signs in through — stateless org-scoped JWTs, Google sign-in, and idempotent onboarding workflows over a graph-backed multi-tenant store."

      - company: Handshake AI
        position: AI Specialist
        location: Remote
        start_date: 2026-07
        summary: Contract
        highlights:
          - "Design and run evaluations of frontier coding agents on long-horizon tasks, measuring behavior including approval-request frequency; red-teamed agent policy boundaries on a simulated social platform and documented reproducible failure cases."

      - company: Meituan
        position: Software Engineer Intern
        location: Shenzhen, China
        start_date: 2024-06
        end_date: 2024-08
        summary: Internship
        highlights:
          - "Built a scalable Python microservice for batch PDF processing in production, handling ingestion, processing, and delivery through an API and parallelizing work at the page level so large documents process independently and failures stay isolated."
          - "Designed the pipeline to be layout-aware rather than OCR-only: PyMuPDF parses text, images, and layout from each PDF while a Detectron2 model detects document structure — titles, paragraphs, tables, and figures — and OCR runs selectively where no text is recoverable, improving extraction accuracy 22% over text-only parsing."
          - "Fused extracted text with detected structure into a machine-readable document representation of typed blocks with coordinates and text, so downstream search, extraction, and analysis work from structured JSON, and surfaced the same structure as tables and highlighted document views for review."
          - "Containerized the services with Docker and deployed on Kubernetes with horizontal scaling and rolling updates, reducing end-to-end latency 40% with zero-downtime releases."

    Research:
      - company: Mechanical and AI Lab, Carnegie Mellon University
        position: Research Assistant
        location: Pittsburgh, PA
        start_date: 2024-11
        end_date: 2025-12
        summary: ""
        highlights:
          - "<strong>Distributed Fault-Tolerant System</strong> — designed a distributed fault-tolerant system with active/passive replication, Redis deduplication, and heartbeat-driven failover, detecting failures within 1s and auto-recovering within 3s without message loss."
          - "<strong>AI Agent for Scientific Exploration</strong> — built a scientific exploration agent that analyzes 1,000+ research papers to generate evidence-backed hypotheses, integrating semantic retrieval, multi-step reasoning, self-critique, human feedback, and Google Scholar search, reducing prior-work overlap and weakly supported hypotheses by 40%."
          - "<strong>Meta-Learning vs. Finetuning on Protein Mutation Sequences</strong> — developed a PyTorch MAML framework for multi-task protein mutation sequence prediction with 16-shot adaptation and modular training across datasets, achieving 46% lower MSE, 10% higher accuracy, and 73% lower training time than finetuning baselines."
          - "<strong>Generative AI-Powered Document Automation</strong> — built an end-to-end platform converting PDFs into structured slides and narrated videos, with Python REST APIs, a React frontend for upload and status tracking, and AWS Lambda/EC2/S3/SQS orchestration, cutting processing to under 5 minutes per document and compute cost by 35%."

